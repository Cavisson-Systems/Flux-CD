apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: boutique
  namespace: boutique
spec:
  interval: 5m
  chart:
    spec:
      chart: helm-chart/
      sourceRef:
        kind: GitRepository
        name: boutique
  values:
    images:
      repository: us-central1-docker.pkg.dev/google-samples/microservices-demo
      tag: ""
