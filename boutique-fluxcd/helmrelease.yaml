apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: boutique
  namespace: boutique
spec:
  interval: 5m
  chart:
    spec:
      chart: microservices-demo/helm-chart/
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: boutique
  dependsOn:                          # wait until the agent upgrade is done
    - name: cavisson-agent
      namespace: cavisson
  postRenderers:                      # stamp agent version on every boutique pod
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: any
              spec:
                template:
                  metadata:
                    annotations:
                      cavisson.io/agent-version: "4.16.0.B93"   # cavisson-ci: agent-version

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cavisson-agent
  namespace: cavisson
spec:
  interval: 5m
  chart:
    spec:
      chart: ./
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: cavisson-agent
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    cmon:
      image:
        tag: "4.16.0.B93"   # cavisson-ci: agent-version
    cavproxy:
      image:
        tag: "4.16.0.B93"   # cavisson-ci: agent-version
    webhook:
      image:
        tag: "4.16.0.B93"   # cavisson-ci: agent-version
    clusterAgent:
      image:
        tag: testzap
