apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cavisson-agent
  namespace: cavisson
spec:
  interval: 5m
  chart:
    spec:
      chart: ./
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: cavisson-agent
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    cmon:
      image:
        tag: "4.16.0.B96"
    cavproxy:
      image:
        tag: "4.16.0.B96"
    webhook:
      image:
        tag: "4.16.0.B96"
    clusterAgent:
      image:
        tag: "4.16.0.B96"
