apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: boutique-app
  namespace: flux-system
spec:
  interval: 5m
  path: boutique-fluxcd
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      AGENT_VERSION: "4.16.0.B92"     # ← the only line you change for an agent upgrade
